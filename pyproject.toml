[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelens"
version = "0.1.0"
description = "VoC Data Engineering & Analytics Platform for Cross-Border E-commerce"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VoiceLens" }]
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "prefect>=3.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
retrieval = [
    # Used by LocalEmbeddingProvider. Pulls torch transitively. Kept as
    # an optional extra so the base install stays lightweight and the
    # mock-embedding test path doesn't drag torch into CI.
    "sentence-transformers>=3.0",
    # Used by the M3B BM25 lexical baseline + RRF hybrid retriever. Tiny
    # pure-Python implementation; ships alongside sentence-transformers
    # so a single `pip install -e .[retrieval]` brings up everything
    # needed for both indexing and the evaluation harness.
    "rank_bm25>=0.2",
]
analytics = [
    # M4A topic clustering. scikit-learn powers the TF-IDF + KMeans
    # baseline; it is lightweight enough to keep in the test path.
    # BERTopic is intentionally NOT pinned here — it pulls UMAP + HDBSCAN
    # and is used only when separately installed.
    "scikit-learn>=1.4",
]
dashboard = [
    # M5A Streamlit analytics dashboard. Kept as an optional extra so
    # the base install and CI test path stay free of streamlit's heavy
    # dependency tree (pyarrow, altair, tornado).
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voicelens*"]
exclude = ["voicelens.tests*", "voicelens.data*"]

[tool.setuptools.package-data]
voicelens = ["data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["voicelens/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These runnable scripts bootstrap sys.path (so the `scripts` package is
# importable when the file is executed directly) before importing sibling
# script modules, which necessitates imports below a statement.
"scripts/export_retrieval_review_candidates.py" = ["E402"]
"scripts/tune_retrieval_hybrid.py" = ["E402"]
"scripts/evaluate_rag_smoke.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["voicelens/tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
