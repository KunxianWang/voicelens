name: voicelens

services:
  postgres:
    image: postgres:16-alpine
    container_name: voicelens-postgres
    environment:
      POSTGRES_USER: voicelens
      POSTGRES_PASSWORD: voicelens
      POSTGRES_DB: voicelens
    ports:
      - "5432:5432"
    volumes:
      - voicelens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelens -d voicelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: voicelens-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - voicelens_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voicelens_pg_data:
  voicelens_qdrant_data:
